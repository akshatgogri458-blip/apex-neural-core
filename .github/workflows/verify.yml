name: Verify APEX Worker build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"
      - name: Install dependencies (same as Cloudflare)
        run: bun install
      - name: Type-check Worker
        run: bun run typecheck
