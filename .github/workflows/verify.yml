name: Verify APEX Worker build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Type checking and negative security tests
        run: npm run check
      - name: Package Worker without deployment or inference
        run: npx wrangler deploy --dry-run
